name: Envia versao para Google Play Console (Tester)

on:
  workflow_dispatch:
  push:
    branches:
      - developer

jobs:
  deploy-google-play:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 📋 Informações da Execução
        run: |
          echo "🌿 Branch atual: ${{ github.ref_name }}"
          echo "📦 App ID (Android): com.soujunior.petjournal"
          echo "🔢 Version Code: ${{ vars.NEXT_VERSION_CODE }}"
          echo "🏷️ Version Name: 1.0.${{ vars.NEXT_VERSION_CODE }}"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x petJournal/gradlew

      - name: Setup Keystore
        run: |
          mkdir -p petJournal/app 
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > petJournal/app/keystore.jks

      - name: Create key.properties
        run: |
          cat > petJournal/key.properties <<EOF
          storeFile=${{ github.workspace }}/petJournal/app/keystore.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build App Bundle (Release)
        working-directory: ./petJournal
        run: |
          ./gradlew :app:bundleRelease \
            -PversionCode=${{ vars.NEXT_VERSION_CODE }} \
            -PversionName="1.0.${{ vars.NEXT_VERSION_CODE }}"

      - name: "Checar Secret do Google"
        env:
          SECRET: "${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}"
        run: |
          if [ -z "$SECRET" ]; then
            echo "🚨 ERRO: A variável secreta está VAZIA."
            exit 1
          fi
          echo "✅ SUCESSO: A variável foi encontrada e contém dados!"

      - name: "Criar Arquivo JSON do Google"
        env:
          SECRET_VAL: "${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}"
        run: echo "$SECRET_VAL" | base64 --decode > petJournal/service-account.json
        
      - name: Upload to Google Play
        id: upload
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: petJournal/service-account.json
          packageName: com.soujunior.petjournal
          releaseFiles: petJournal/app/build/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed

      - name: Resultado do Deploy
        if: always()
        run: |
          if [ "${{ steps.upload.outcome }}" = "success" ]; then
            echo "🎉 CONEXÃO E UPLOAD REALIZADOS COM SUCESSO!"
            echo "Version Code enviado: ${{ vars.NEXT_VERSION_CODE }}"
          else
            echo "❌ Falha no processo. Verifique os logs acima."
            exit 1
          fi

      - name: Atualizar NEXT_VERSION_CODE após sucesso
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CURRENT_VERSION: ${{ vars.NEXT_VERSION_CODE }}
        run: |
          NEXT_VERSION=$((CURRENT_VERSION + 1))
          echo "📈 Atualizando NEXT_VERSION_CODE de $CURRENT_VERSION para $NEXT_VERSION"
          gh variable set NEXT_VERSION_CODE --body "$NEXT_VERSION" -R "$REPO"
          echo "✅ Variável atualizada com sucesso para: $NEXT_VERSION"