name: Envia versao para Google Play Console (Android Kotlin)

on:
  workflow_dispatch:
  push:
    branches:
      - developer

jobs:
  deploy-google-play:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 📋 Informações da Execução
        run: |
          echo "🌿 Branch atual: ${{ github.ref_name }}"
          echo "📦 App ID (Android): com.soujunior.petjournal"
          echo "🔢 Version Code: ${{ github.run_number }}"
          echo "🏷️ Version Name: 1.0.${{ github.run_number }}"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x petJournal/gradlew

      - name: Setup Keystore
        run: |
          mkdir -p petJournal/app 
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > petJournal/app/keystore.jks

